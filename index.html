<!DOCTYPE html>
<!-- SpaceB&B — Single Page Application. Shell unica: header+nav, <main id="app">, footer.
     Tutta la navigazione è client-side (router hash-based in js/mav.js); ogni pagina è una
     rotta MAV (Model-Action-View) montata dentro #app. Vedi README (sezione "Architettura frontend"). -->
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="description" content="Trova e prenota case, stanze e appartamenti unici con SpaceB&amp;B: ricerca per città, ospiti e prezzo.">
<title>SpaceB&amp;B</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23B34E2C'/%3E%3Cpath d='M5 12.5 12 6l7 6.5' stroke='white' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M7 11v7h10v-7' stroke='white' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip-link" href="#" id="skipLink">Vai al contenuto principale</a>
<header>
  <a class="logo" href="#/">SpaceB&amp;B</a>
  <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="nav" aria-label="Apri menu di navigazione">
    <span></span><span></span><span></span>
  </button>
  <nav id="nav" aria-label="Navigazione principale"></nav>
</header>
<main class="container" id="app" tabindex="-1" aria-live="polite"></main>
<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-brand">
      <span class="logo">SpaceB&amp;B</span>
      <p>Trova e prenota il tuo prossimo soggiorno.</p>
    </div>
    <nav class="footer-links" aria-label="Link utili">
      <a href="#/">Esplora</a>
      <a href="#/host">Diventa host</a>
      <a href="#/prenotazioni">Le mie prenotazioni</a>
    </nav>
    <p class="footer-copy">&copy; 2026 SpaceB&amp;B · Progetto universitario</p>
  </div>
</footer>

<!-- Servizi condivisi: infrastruttura Model (api), sessione/nav (auth), helper View (ui), runtime+router (mav) -->
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/mav.js"></script>
<!-- Componenti View condivisi -->
<script src="js/cards.js"></script>
<script src="js/modal.js"></script>
<script src="js/daterange.js"></script>
<!-- I tre livelli MAV dell'applicazione, poi il bootstrap che registra le rotte e avvia il router -->
<script src="js/model.js"></script>
<script src="js/view.js"></script>
<script src="js/action.js"></script>
<script src="js/app.js"></script>
</body>
</html>
